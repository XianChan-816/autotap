# 云端构建 FloatingTap 越狱 tweak（.deb，rootless arm64e）
#
# 无需 Mac：Ubuntu runner + Theos 交叉编译。
# 产出 FloatingTap.deb，Sileo/Zebra 或 Filza+dpkg 安装（Dopamine 越狱环境）。

name: Build FloatingTap Tweak

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["FloatingTap/**", ".github/workflows/build-tweak.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang dpkg-dev fakeroot libc6-dev libplist-dev make libssl-dev xz-utils git-lfs

      - name: Clone Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos || {
            curl -fsSL https://github.com/theos/theos/archive/refs/heads/master.tar.gz -o /tmp/theos.tar.gz
            tar xzf /tmp/theos.tar.gz -C $HOME
            mv $HOME/theos-master $HOME/theos
            echo "theos: fetched via tarball (no submodules)"
          }

      # Linux 上 Theos 需要预编译的 iOS 交叉工具链（clang + ldid）。
      # 来源是 L1ghtmann/llvm-project 的 GitHub Release 预编译包（官方安装脚本同款），
      # 不是 theos/toolchain git 仓库。解压后路径为
      #   $THEOS/toolchain/linux/iphone/bin/{clang,ldid,...}
      # GitHub Actions ubuntu runner 是 x86_64，下载 x86_64 版。
      - name: Install iOS toolchain (prebuilt clang+ldid)
        run: |
          set -e
          TC_URL="https://github.com/L1ghtmann/llvm-project/releases/download/test-210562a/iOSToolchain-x86_64.tar.xz"
          curl -fsSL "$TC_URL" -o /tmp/toolchain.tar.xz
          mkdir -p "$HOME/theos/toolchain"
          tar -xJf /tmp/toolchain.tar.xz -C "$HOME/theos/toolchain/"
          ls -la "$HOME/theos/toolchain/linux/iphone/bin/clang"
          "$HOME/theos/toolchain/linux/iphone/bin/clang" --version | head -1
          echo "toolchain OK"

      # 新版 Ubuntu 自带 Perl(5.34+) 禁止 logos 旧代码里的 `shift $args` 写法，
      # 会让 logos.pl 在预处理阶段崩溃（表现为 Preprocessing Tweak.xm Error 2）。
      # 社区标准修复：把 shift $args 改成 shift @{$args}。
      - name: Patch logos for modern perl
        run: |
          GP="$HOME/theos/vendor/logos/bin/lib/Logos/Group.pm"
          if [ -f "$GP" ]; then
            sudo sed -i 's/shift \$args;/shift @{$args};/g' "$GP"
            echo "patched Group.pm for modern perl"
          else
            echo "Group.pm not found, skip perl patch"
          fi

      - name: Download iOS SDK (theos/sdks git-lfs dir)
        run: |
          sudo apt-get install -y git-lfs
          mkdir -p $HOME/theos/sdks
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/sdks
          cd $HOME/sdks
          # theos/sdks 仓库里是解压好的 .sdk 目录（不是 zip）。
          # 选 iOS 15.x 系列，最贴合用户 15.5 设备，向下兼容 deployment 15.0。
          SDK_DIR=$(ls -d iPhoneOS15*.sdk 2>/dev/null | sort -V | tail -1)
          echo "Selected SDK: ${SDK_DIR}"
          [ -n "$SDK_DIR" ] || { echo "NO SDK DIR FOUND"; exit 1; }
          git lfs pull --include "${SDK_DIR}/**"
          SIZE=$(du -sm "$SDK_DIR" 2>/dev/null | cut -f1)
          echo "SDK size after pull: ${SIZE} MB"
          [ "${SIZE:-0}" -gt 5 ] || { echo "SDK pull failed (too small, LFS not fetched)"; exit 1; }
          cp -R "$SDK_DIR" "$HOME/theos/sdks/"
          ls "$HOME/theos/sdks"

      - name: Build .deb
        run: |
          export THEOS=$HOME/theos
          cd FloatingTap
          set -o pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee build.log
          MAKE_RC=${PIPESTATUS[0]}
          echo "=== build.log tail ==="
          tail -n 40 build.log
          echo "=== locate deb ==="
          find . -name "*.deb" -print -exec ls -la {} \;
          DEB=$(find . -name "*.deb" | head -1)
          if [ -n "$DEB" ]; then
            mkdir -p /tmp/debout
            cp "$DEB" /tmp/debout/
            echo "STAGED_DEB=$DEB"
          else
            echo "NO DEB PRODUCED — see build.log above"
          fi
          exit $MAKE_RC

      - name: Upload deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTap.deb
          path: |
            FloatingTap/packages/*.deb
            FloatingTap/.theos/packages/*.deb
            /tmp/debout/*.deb
          if-no-files-found: warn

      # 调试辅助：构建失败时把 build.log 推到仓库 .debug/build.log，
      # 便于直接在仓库里查看编译错误（artifact 下载需要认证，这里绕开）
      - name: Push build log to repo (debug, failure only)
        if: failure() && steps.build.outcome == 'failure'
        run: |
          cd /home/runner/work/autotap/autotap
          mkdir -p .debug
          cp FloatingTap/build.log .debug/build.log || echo "no build.log"
          git config user.email "ci-debug@example.com"
          git config user.name "CI Debug"
          git add -f .debug/build.log
          git commit -m "chore(debug): build.log from failed run" || echo "nothing to commit"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/XianChan-816/autotap.git" HEAD:main || echo "push failed"

      - name: Upload build log (on failure or success)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: FloatingTap/build.log
          if-no-files-found: ignore
