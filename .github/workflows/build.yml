# 云端构建无签名 IPA（无需本地 Mac）
#
# 把本仓库推到 GitHub，在 Actions 页面手动触发 "Build IPA"，
# 几分钟后在 Artifacts 里下载 AutoTap.ipa，用 TrollStore 安装。
#
# 注意：由于使用私有 IOHIDEvent 接口 + 私有 entitlement，
# 普通免费证书/侧载（AltStore、Sideloadly）无法生效，仅 TrollStore 或越狱可用。

name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # 固定 xcodegen 2.40.0（Xcode 15 时代版本，生成 objectVersion 60 传统格式）。
      # 最新版 xcodegen 默认生成 objectVersion 77（Xcode 16+ 格式），Xcode 15.4 无法打开。
      - name: Install xcodegen 2.40.0 (pinned)
        run: |
          curl -fsSL -o /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.40.0/xcodegen.zip
          ls -la /tmp/xcodegen.zip
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen
          find /tmp/xcodegen -type f -name xcodegen
          XGBIN=$(find /tmp/xcodegen -type f -name xcodegen | head -1)
          sudo cp "$XGBIN" /usr/local/bin/xcodegen
          sudo chmod +x /usr/local/bin/xcodegen
          xcodegen version

      - name: Generate Xcode project
        run: xcodegen generate --spec AutoTap/project.yml

      - name: Inspect generated project format
        run: |
          ls -la AutoTap/AutoTap.xcodeproj/
          grep -E "objectVersion|compatibilityVersion" \
            AutoTap/AutoTap.xcodeproj/project.pbxproj | head -5

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project AutoTap/AutoTap.xcodeproj \
            -scheme AutoTap \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # ⚠️ 关键：必须把 AutoTap.entitlements 注入 binary，否则 App 是默认 sandbox 进程，
      # 所有 /var/mobile/Library/Preferences、/tmp 都被重定向到容器，tweak 与 App 永远跨不了进程。
      # TrollStore 安装时会保留 binary 内嵌的 entitlements（no-sandbox / HID / 枚举权限）。
      - name: Install ldid
        run: brew install ldid

      - name: Inject entitlements into binary
        run: |
          APP=build/DerivedData/Build/Products/Debug-iphoneos/AutoTap.app
          BIN="$APP/AutoTap"
          ENT=AutoTap/Resources/AutoTap.entitlements
          ls -la "$ENT"
          ldid -S"$ENT" "$BIN"
          echo "--- 验证 entitlements 已注入 ---"
          ldid -e "$BIN" | grep -E "no-sandbox|platform-application|hid.system|mobileinstall|lsapplicationworkspace" || true

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Debug-iphoneos/AutoTap.app build/Payload/
          cd build && zip -qry AutoTap.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTap.ipa
          path: build/AutoTap.ipa
          if-no-files-found: error
