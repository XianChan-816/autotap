name: AutoTap
options:
  bundleIdPrefix: com.autotap
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  AutoTap:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: HIDBridge
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: AutoTap
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Resources/AutoTap.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autotap.app
        PRODUCT_NAME: AutoTap
        CODE_SIGN_ENTITLEMENTS: Resources/AutoTap.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: HIDBridge/AutoTap-Bridging-Header.h
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
